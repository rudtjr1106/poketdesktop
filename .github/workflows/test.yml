# 밀어 넣을 때마다 검사를 돌린다.
#
# 그동안은 검사가 있어도 사람이 기억해서 돌려야 했고, 그마저도 실서버를
# 두드리는 것들이라 함부로 못 돌렸다. 여기서는 워크플로 안에 서버를
# 띄우고 그쪽으로 붙는다 - 실서버와 친구들 데이터는 건드리지 않는다.
#
# 공개 저장소라 Actions 분이 무료다.

name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 서버가 필요 없는 것들. 빠르니까 먼저 돌려서 일찍 실패하게 한다.
  pure:
    name: 계산만 하는 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 계산만 하는 검사라도 poketdesktop 모듈을 불러오면 딸려 오는 것이
      # 있다 (test_battle_ui -> desktop_battle -> evolve_fx -> PIL).
      # 트레이(pystray)는 여기서 필요 없고 리눅스에서는 X 도 없다.
      - name: 준비물
        run: pip install pillow requests

      - name: 파티전 엔진
        run: python tools/sim_party.py 300

      - name: 투기장 좌표
        run: python client/test_layout.py

      # 창을 안 만드는 것들. 어느 OS 에서나 그대로 돈다.
      - name: 지난 시간 표기
        run: python common/test_korean.py

      - name: 배틀 화면 (체력바)
        run: python client/test_battle_ui.py

      - name: 부팅 직후 로그인 재시도
        run: python client/test_boot_retry.py

      - name: 걷는 범위
        run: python client/test_walk_bounds.py

      - name: 휠 한 칸
        run: python client/test_wheel.py

      - name: 대전 목록 시각 (UTC -> 내 시간대)
        run: python client/test_pvp_when.py

      - name: 기술 설명 (본가 문장)
        run: python client/test_move_desc.py

      - name: 던지는 몬스터볼 그림
        run: python client/test_ball_sprite.py

      - name: 진화 뒤 도트
        run: python client/test_evolve_sprite.py

      - name: 풀숲 끄기·알림·패치노트
        run: python client/test_new_settings.py

      # 바뀐 것을 두 곳에 적으면 갈라진다. 앱 안의 '새로운 기능' 창과
      # 릴리스 본문이 어긋난 채로 나가면, 받은 사람은 자기가 받은 판에
      # 무엇이 들어 있는지 알 수 없다.
      - name: 릴리스 본문이 패치노트와 같은가
        run: python tools/make_release_notes.py --check

      - name: 문법
        run: |
          python - <<'EOF'
          import ast, builtins, glob, io, sys

          def free_names(tree):
              """정의도 임포트도 없이 읽기만 하는 이름을 모은다.

              문법은 멀쩡한데 그 줄을 밟는 순간 NameError 로 죽는 것을
              잡는다. 진화 연출이 walk_cache 를 안 들여온 채로 부르다
              그렇게 죽었고, 예외는 작업 스레드에서 삼켜져 화면에는
              "도트를 못 받았다" 로만 보였다.
              """
              d = set(dir(builtins)) | {"__file__", "__name__", "__doc__"}
              for n in ast.walk(tree):
                  if isinstance(n, ast.Import):
                      for a in n.names:
                          d.add(a.asname or a.name.split(".")[0])
                  elif isinstance(n, ast.ImportFrom):
                      for a in n.names:
                          d.add(a.asname or a.name)
                  elif isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef,
                                      ast.ClassDef)):
                      d.add(n.name)
                  elif isinstance(n, ast.Name) and isinstance(n.ctx, ast.Store):
                      d.add(n.id)
                  elif isinstance(n, ast.arg):
                      d.add(n.arg)
                  elif isinstance(n, ast.ExceptHandler) and n.name:
                      d.add(n.name)
                  elif isinstance(n, (ast.Global, ast.Nonlocal)):
                      d.update(n.names)
              out = {}
              for n in ast.walk(tree):
                  if (isinstance(n, ast.Name) and isinstance(n.ctx, ast.Load)
                          and n.id not in d):
                      out.setdefault(n.id, n.lineno)
              return out

          bad = []
          for f in (glob.glob("client/**/*.py", recursive=True)
                    + glob.glob("server/**/*.py", recursive=True)
                    + glob.glob("common/*.py") + glob.glob("tools/*.py")):
              if "__pycache__" in f or "/_cache/" in f:
                  continue
              try:
                  tree = ast.parse(io.open(f, encoding="utf-8").read())
              except SyntaxError as e:
                  bad.append("%s:%s %s" % (f, e.lineno, e.msg))
                  continue
              for nm, ln in sorted(free_names(tree).items(),
                                   key=lambda x: x[1]):
                  bad.append("%s:%s 이런 이름이 없다: %s" % (f, ln, nm))
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("문법 오류 없음")
          EOF

  # OS 에 매인 것들. **여기가 없어서 실제로 한 번 놓쳤다** - 맥 작업으로
  # tray.build_menu() 가 없어졌는데, 그걸 부르던 smoke_autostart.py 가
  # 아무 데서도 안 돌아서 한참 뒤에야 드러났다.
  #
  # 러너에는 화면이 있어서 tkinter 창도 만들어진다. 공개 저장소라 무료다.
  windows:
    name: 윈도우 전용
    runs-on: windows-latest
    timeout-minutes: 15
    # **러너의 콘솔이 cp1252 다.** 검사는 진행 상황을 한글로 찍으므로
    # 그대로 두면 UnicodeEncodeError 로 죽는다. 진짜 윈도우 PC 는
    # 코드페이지가 949 라 멀쩡해서, 여기서만 나는 일이다.
    # (release.yml 도 같은 이유로 같은 것을 잡아 둔다)
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 준비물
        run: pip install -r client/requirements.txt
      - name: 자동 시작 (레지스트리)
        run: python client/test_autostart.py
      - name: 설정 창·트레이 (창을 실제로 만든다)
        run: python client/smoke_autostart.py
      - name: 테두리 없는 창이 제자리에 뜨는가
        run: python client/smoke_window.py
      # 정해 둔 창 높이가 내용보다 작으면 맨 아래 단추가 잘려서, 사용자가
      # 할 수 있는 일이 창 닫기밖에 없어진다. 실제로 두 창이 그랬다.
      - name: 설정·패치노트·새버전 창 높이
        run: python client/smoke_new_windows.py
      # 레벨이 올라도 바탕화면 이름표는 옛 숫자였다 (1.0.20 에서 고침).
      # 창을 실제로 띄워 서버 값이 바뀌면 이름표가 따라오는지 본다.
      - name: 이름표가 서버 값을 따라오는가
        run: python client/smoke_nameplate.py

  mac:
    name: 맥 전용
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 준비물
        run: pip install -r client/requirements.txt
      # 아래 셋은 창을 안 띄운다. 러너에서 그대로 돈다.
      - name: 자동 시작 (LaunchAgent)
        run: python client/test_autostart_mac.py
      - name: 입력 (오른쪽 클릭·휠)
        run: python client/test_mac_input.py
      - name: 업데이트 (dmg)
        run: python client/test_update_mac.py
      - name: 테두리 없는 창이 제자리에 뜨는가
        run: python client/smoke_window.py
      - name: 설정·패치노트·새버전 창 높이
        run: python client/smoke_new_windows.py
      # 레벨이 올라도 바탕화면 이름표는 옛 숫자였다 (1.0.20 에서 고침).
      # 창을 실제로 띄워 서버 값이 바뀌면 이름표가 따라오는지 본다.
      - name: 이름표가 서버 값을 따라오는가
        run: python client/smoke_nameplate.py
      # 이건 메뉴 막대에 아이콘을 잠깐 올렸다 내린다 - **화면이 필요하다.**
      # 러너에 로그인 세션이 없어서 NSStatusBar 가 안 되면 이 줄만 지워라.
      # (맥 없이 적은 것이라 첫 실행에서 확인이 필요하다)
      - name: 트레이 (NSStatusItem)
        run: python client/test_tray_mac.py

  # 서버를 띄우고 HTTP 로 두드리는 것들.
  server:
    name: 서버 검사
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성
        run: pip install -r server/requirements.txt

      - name: 서버 띄우기
        env:
          POKET_DB: /tmp/poket-test.db
          POKET_POKEDEX: ${{ github.workspace }}/server/data/pokedex.json
          POKET_REQUIRE_IP: "0"
          # 검사에서만 여는 뒷문 둘. 이게 없으면 야생이 걸린 검사를
          # 돌릴 수가 없다(첫 조우까지 기다려야 한다).
          POKET_ALLOW_FORCE_WILD: "1"
          POKET_ALLOW_ADD_EXP: "1"
          POKET_WILD_COOLDOWN_MIN: "60"
          POKET_WILD_COOLDOWN_MAX: "60"
          POKET_MISS_COOLDOWN: "60"
          # 도트를 받아 두는 곳. 기본값 /data/sprites 는 도커 안에만 있다.
          POKET_SPRITE_DIR: /tmp/sprites
          POKET_WALK_DIR: /tmp/walk
          # 켜지 않는다. test_server 의 'IP 위조 차단' 검사가 '프록시를
          # 안 믿는 상태에서 헤더가 무시되는가' 를 보는 것이라, 켜면
          # 오히려 그 검사가 깨진다. 실서버(Render)에서만 켠다.
          POKET_TRUST_PROXY: "0"
        run: |
          mkdir -p /tmp/sprites /tmp/walk
          cd server
          # --forwarded-allow-ips= 를 비워 둔다. uvicorn 은 기본으로
          # 127.0.0.1 에서 온 요청의 X-Forwarded-For 를 믿고
          # request.client.host 를 바꿔치기하는데, 그러면 'IP 위조
          # 차단' 검사가 깨진다. 도커에서는 접속 주소가 172.17.0.1 이라
          # 그 기본값에 안 걸려서 드러나지 않던 차이다.
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8788 \
                --forwarded-allow-ips= \
                --log-level warning > /tmp/server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -s --max-time 3 http://127.0.0.1:8788/api/health > /dev/null; then
              echo "떴다"
              curl -s http://127.0.0.1:8788/api/health
              echo
              exit 0
            fi
            sleep 2
          done
          echo "::error::서버가 안 떴습니다"
          cat /tmp/server.log
          exit 1

      # 서버가 붙잡고 있는 DB 를 다른 프로세스가 같이 쓰면 SQLite 가
      # 잠근다. 이 둘은 자기 DB 를 따로 쓴다.
      - name: 서버 안에서 도는 검사
        env:
          POKET_DB: /tmp/poket-unit.db
          POKET_POKEDEX: ${{ github.workspace }}/server/data/pokedex.json
        run: |
          # server/ 안에서 돌지만 common 은 저장소 루트에 있다.
          # 도커에서는 둘이 /app 아래 나란히 놓여서 문제가 없었다.
          export PYTHONPATH="${{ github.workspace }}"
          cd server
          python test_pvp.py
          python test_walk.py

      - name: HTTP 로 두드리는 검사
        run: |
          python server/test_server.py  http://127.0.0.1:8788
          python server/test_battle.py  http://127.0.0.1:8788
          python server/test_items.py   http://127.0.0.1:8788
          python server/test_social.py  http://127.0.0.1:8788
          python server/test_arena.py   http://127.0.0.1:8788

      - name: 서버 로그 (실패했을 때만)
        if: failure()
        run: tail -100 /tmp/server.log
