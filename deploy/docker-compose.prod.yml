# 서버에 올릴 때 쓰는 구성. 개발용(../docker-compose.yml)과 다른 점:
#
#   - Caddy 가 앞에 서서 HTTPS 를 처리한다 (인증서 자동 발급/갱신)
#   - 서버 포트를 바깥으로 열지 않는다. Caddy 만 접근할 수 있다
#   - POKET_TRUST_PROXY=1 이라서 자동 로그인 IP 확인이 실제로 동작한다
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build

services:
  poket-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: poketdesktop-server:latest
    container_name: poketdesktop-server
    restart: unless-stopped
    expose:
      - "8080"                     # 호스트에 노출하지 않는다
    volumes:
      - poketdata:/data
    environment:
      POKET_DB: /data/poket.db
      POKET_POKEDEX: /app/data/pokedex.json
      POKET_ITEMS: /app/data/items.json
      POKET_SPRITE_DIR: /data/sprites
      # 이 경로는 인증만 통과하면 경험치를 마음대로 넣을 수 있다.
      # 도구·돈이 경험치에 걸려 있으므로 운영에서는 반드시 막는다.
      POKET_ALLOW_ADD_EXP: "0"
      # Caddy 뒤에 있으므로 X-Forwarded-For 를 믿어도 된다
      POKET_TRUST_PROXY: "1"
      POKET_REQUIRE_IP: "1"
      POKET_WILD_COOLDOWN_MIN: "300"
      POKET_WILD_COOLDOWN_MAX: "420"
      POKET_GRASS_TTL: "90"
      POKET_WILD_TTL: "60"
      POKET_BALLS_START: "10"
      POKET_MONEY_START: "3000"
      POKET_MAX_DESKTOP: "6"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: poketdesktop-caddy
    restart: unless-stopped
    depends_on:
      - poket-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      POKET_DOMAIN: ${POKET_DOMAIN:?POKET_DOMAIN 을 .env 에 넣어 주세요}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL 을 .env 에 넣어 주세요}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  poketdata:
  caddydata:
  caddyconfig:
