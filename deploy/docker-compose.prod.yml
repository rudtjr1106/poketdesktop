# 서버에 올릴 때 쓰는 구성 (AWS Lightsail 등 리눅스 VM).
# 개발용(../docker-compose.yml)과 다른 점:
#
#   - Caddy 가 앞에 서서 HTTPS 를 처리한다 (인증서 자동 발급/갱신)
#   - 서버 포트를 바깥으로 열지 않는다. Caddy 만 접근할 수 있다
#   - POKET_TRUST_PROXY=1 이라서 자동 로그인 IP 확인이 실제로 동작한다
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build

services:
  poket-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: poketdesktop-server:latest
    container_name: poketdesktop-server
    restart: unless-stopped
    expose:
      - "8080"                     # 호스트에 노출하지 않는다
    volumes:
      - poketdata:/data
    environment:
      POKET_DB: /data/poket.db
      POKET_POKEDEX: /app/data/pokedex.json
      POKET_ITEMS: /app/data/items.json
      POKET_SPRITE_DIR: /data/sprites
      # 이 경로는 인증만 통과하면 경험치를 마음대로 넣을 수 있다.
      # 도구·돈이 경험치에 걸려 있으므로 운영에서는 반드시 막는다.
      POKET_ALLOW_ADD_EXP: "0"
      # 조우 간격을 무시하고 풀숲을 돋우는 시험용 문. 운영에서는 반드시 막는다.
      POKET_ALLOW_FORCE_WILD: "0"
      # 도트를 미리 받아두지 않는다. 여기는 디스크가 남아 있어서 한 번 받은
      # 것은 계속 쓰인다 - 처음에 900장을 몰아 받을 이유가 없다.
      POKET_WARM_SPRITES: "0"
      # 새 앱 판이 나오면 붙어 있는 앱에 소켓으로 바로 알린다 (깃허브 최신 릴리스를 2분마다 본다, release_watch)
      POKET_RELEASE_WATCH: "1"
      # /api/errors 로 역추적을 볼 때 쓰는 열쇠. .env 에 넣는다.
      # 비어 있으면 그 경로는 아예 없는 것처럼 군다.
      POKET_ADMIN_KEY: ${POKET_ADMIN_KEY:-}
      # 게시판 운영자의 닉네임들 (쉼표로 나눈다). 공지를 쓰고, 남의 글·댓글을 지우고, 글 옆에
      # '운영자' 표시가 붙는다. **누구인지는 저장소가 아니라 서버의 .env 에 적는다** -
      # 안 적으면 기본값이다. 맨 앞 사람의 이름으로 패치노트 글이 올라간다.
      POKET_BOARD_ADMINS: ${POKET_BOARD_ADMINS:-나여조경석}
      # Caddy 뒤에 있으므로 X-Forwarded-For 를 믿어도 된다
      POKET_TRUST_PROXY: "1"
      POKET_REQUIRE_IP: "1"
      POKET_WILD_COOLDOWN_MIN: "300"
      POKET_WILD_COOLDOWN_MAX: "420"
      POKET_MISS_COOLDOWN: "150"
      POKET_GRASS_TTL: "90"
      POKET_WILD_TTL: "60"
      POKET_BALLS_START: "10"
      POKET_MONEY_START: "3000"
      # 바탕화면에 동시에 둘 수 있는 마리 수. (POKET_MAX_DESKTOP 이 아니다 -
      #  그 이름은 아무 데서도 읽지 않는다)
      POKET_MAX_PARTY: "6"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: poketdesktop-caddy
    restart: unless-stopped
    depends_on:
      - poket-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 함께 올린 다른 서비스의 사이트 설정(Caddyfile 맨 끝 import). 폴더는 미리 만들어 둔다: mkdir -p ~/caddy-sites
      - /home/ubuntu/caddy-sites:/etc/caddy/sites:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      POKET_DOMAIN: ${POKET_DOMAIN:?POKET_DOMAIN 을 .env 에 넣어 주세요}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL 을 .env 에 넣어 주세요}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  poketdata:
  caddydata:
  caddyconfig:
